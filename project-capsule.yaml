schema_version: c2.project-capsule.v1
identity:
  project_id: 16
  slug: fedora-t7-backup
  repository_id: R0016
scope:
  purpose: Create encrypted, deduplicated Restic snapshots of configured Fedora paths
    on a separately validated external filesystem for file-level recovery.
  boundaries:
  - This is not a block-level disk clone or protection against simultaneous loss of
    host and backup medium.
  - MegaVault owns canonical project identity and runtime inventory; historical C2
    is not a runtime dispatcher.
  - The external backup medium, systemd, udev, and shared notification transport are
    outside repository code.
repository:
  canonical_workdir: /home/daniele/projects/fedora-t7-backup
  branch_policy: Canonical repository follows origin/main; make changes in isolated
    repo-task worktrees and integrate through the guarded single-writer lane.
architecture:
  summary: The systemd backup requires a successful ordered Bitwarden file-preparation
    unit before LoadCredential. The lifecycle validates the expected external filesystem,
    performs backup and maintenance with bounded failure-classified Restic retries,
    syncs and unmounts; the existing notification adapter resolves selected Bitwarden
    fields and persists a safe retry queue.
  entrypoints:
  - scripts/t7-restic-lifecycle
  - scripts/t7-restic-backup
  - scripts/install.sh
  important_paths:
  - scripts
  - systemd
  - udev
  - config
  - tests
  - docs/ai
  - docs/human
dependencies:
- name: Restic
  purpose: Encrypted, compressed, deduplicated snapshot repository and restore operations.
- name: systemd
  purpose: Run the privileged backup lifecycle and reminder/notification-retry units.
- name: udev
  purpose: Request the systemd backup job when the matching USB device is connected.
- name: telegram_notify
  purpose: Shared notification transport; this project does not implement a separate
    Telegram API client.
- name: Fedora Bitwarden root runtime
  purpose: An ordered oneshot preparer decodes only the Restic field to /run with
    root-only permissions before consumer LoadCredential; notification adapters retrieve
    selected fields without plaintext fallback or argument exposure. Active processes
    retain their startup credentials.
data:
  schema: Restic snapshots contain configured host paths and system manifests. Fedora
    System Monitor SQLite is captured through SQLite's online backup API; its live
    database, WAL, and SHM are excluded from filesystem traversal. The repository
    on the external medium is encrypted. This capsule omits device identifiers and
    credential paths.
  migrations: No application database schema or migration framework; Restic maintains
    its own repository format and snapshot metadata.
runtime:
  services:
  - t7-restic-vault-prepare.service must finish successfully before t7-restic-backup.service
    acquires its credential.
  - t7-restic-backup.service owns the gated backup lifecycle.
  - t7-restic-reminder.service and t7-restic-notify-retry.service handle deduplicated
    reminder and queued delivery; source verification never starts them.
  timers:
  - t7-restic-reminder.timer is a static one-shot source definition.
  - t7-restic-notify-retry.timer schedules retry delivery; installed/enabled state
    requires separate current runtime evidence.
  containers: []
devices:
- For any real T7/S6/S4 operation, resolve the durable identity with dim resolve ID
  --json first. The backup validates configured model, serial, UUID, label, mount
  and parent disk; never guess a /dev path.
commands:
