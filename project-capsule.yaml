      gated installer, not by a repository setup script.
  build:
    not_applicable: The project is shell scripts, Python scripts, systemd units, and
      configuration; there is no compiled build artifact.
  test_targeted:
    argv:
    - python3
    - -B
    - tests/test_behavior.py
    - -q
    cwd: .
  test_full:
    argv: &id001
    - bwrap
    - --die-with-parent
    - --unshare-net
    - --unshare-pid
    - --ro-bind
    - /
    - /
    - --tmpfs
    - /home
    - --tmpfs
    - /run
    - --tmpfs
    - /etc/systemd/system
    - --tmpfs
    - /tmp
    - --tmpfs
    - /mnt
    - --tmpfs
    - /media
    - --tmpfs
    - /var/lib
    - --proc
    - /proc
    - --dev
    - /dev
    - --ro-bind
    - .
    - /tmp/work
    - --ro-bind
    - /home/daniele/.local/lib/python3.14/site-packages
    - /home/daniele/.local/lib/python3.14/site-packages
    - --chdir
    - /tmp/work
    - --clearenv
    - --setenv
    - PATH
    - /usr/bin:/bin
    - --setenv
    - HOME
    - /tmp
    - --setenv
    - PYTHONPATH
    - /tmp/work:/tmp/work/src:/home/daniele/.local/lib/python3.14/site-packages
    - --setenv
