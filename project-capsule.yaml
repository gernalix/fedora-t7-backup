  lint:
    argv:
    - git
    - diff
    - --check
    cwd: .
  deploy_install:
    argv:
    - sudo
    - ./scripts/install.sh
    cwd: .
  smoke:
    not_applicable: A real backup smoke test reads or writes the external Restic repository
      and can send notifications; it is a separately authorized operational action.
  verify:
    fast:
      argv:
      - python3
      - /home/daniele/projects/codex-roadmap/tools/project_capsule.py
      - --repo
      - .
      - --mode
      - FAST
      cwd: .
    full:
      argv:
      - python3
      - /home/daniele/projects/codex-roadmap/tools/project_capsule.py
      - --repo
      - .
      - --mode
      - FULL
      cwd: .
safety:
  invariants:
  - Validate the exact expected mounted device before accessing the repository; a
    mount directory alone is not proof that the backup medium is mounted.
  - Never reinitialize or modify an existing repository outside the validated backup
    lifecycle.
  - Never format, repartition, convert, or identify a durable disk by /dev/sdX.
  - Keep the Restic password and notification credentials out of process arguments,
    logs, and Git.
  - Do not declare operational backup PASS without the real device, backup, unmount,
    notification, reminder, secret, and failure-recovery evidence required by the
    live contract.
  risky_operations:
  - scripts/install.sh installs or changes privileged systemd/udev integration; run
    only after explicit operational authorization.
  - The backup lifecycle accesses configured host data and mutates snapshot/retention
    state on the external repository; do not run for source validation.
  - Restore, prune, and repository initialization can change or expose backup data;
    follow docs/human/OPERATIONS.md and preserve repository recoverability.
  recovery:
  - Use Restic restore procedures documented in docs/human/OPERATIONS.md; do not initialize
    or replace the existing repository.
  - The backup is file-level recovery and a single local medium is not off-site protection.
acceptance:
- Capsule FAST and FULL validators pass against the reviewed integrated repository
  head.
- Safe unit and static checks pass without attaching or accessing the backup medium,
  live host state, credentials, or notification endpoints.
- Operational backup success and recoverability are not claimed by source-only capsule
  adoption; the documented live validation gate remains separate.
references:
  megavault: /home/daniele/MegaVault/megavault.sqlite
  c2: Historical-only reference; no lifecycle writes or dispatch.
freshness:
